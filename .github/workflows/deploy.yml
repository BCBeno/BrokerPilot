name: Deploy

# La fiecare push în main publică imaginea în GHCR. Serverul și-o trage singur (Watchtower, vezi infra/docker-compose.yml).
on:
  push:
    branches: [main]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/bcbeno/brokerpilot-web:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_VAPI_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPI_PUBLIC_KEY }}
            NEXT_PUBLIC_VAPI_ASSISTANT_ID=${{ vars.NEXT_PUBLIC_VAPI_ASSISTANT_ID }}
