name: CI

# Rulează la fiecare push pe main și la fiecare pull request.
on:
  pull_request:
  push:
    branches: [main]

# Repo public: workflow-ul poate doar să citească codul.
permissions:
  contents: read

jobs:
  # Aplicația web: stil cod, tipuri TypeScript, teste, build.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
