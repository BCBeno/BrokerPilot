name: brokerpilot

services:
  web:
    image: ghcr.io/${GHCR_OWNER:-local}/brokerpilot-web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:  
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_VAPI_PUBLIC_KEY: ${NEXT_PUBLIC_VAPI_PUBLIC_KEY:-}
        NEXT_PUBLIC_VAPI_ASSISTANT_ID: ${NEXT_PUBLIC_VAPI_ASSISTANT_ID:-}
        APP_VERSION: ${IMAGE_TAG:-dev}
    env_file:   # secretele (Supabase, n8n, AI) vin din .env, care nu intră în git
      - path: ../.env
        required: false
    ports:
      # Ascultă pe toate interfețele LXC-ului, ca tunelul Cloudflare din celălalt LXC să ajungă la el.
      - "3000:3000"
    restart: unless-stopped
    mem_limit: 1536m   # Chromium (PDF) are nevoie de ~300–500 MB în plus
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Actualizare automată: la fiecare minut verifică dacă imaginea din GHCR s-a schimbat; dacă da, o trage și repornește `web`.
  watchtower:
    image: nickfedor/watchtower:latest
    environment:
      WATCHTOWER_POLL_INTERVAL: "60"
      WATCHTOWER_CLEANUP: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
